<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Shots</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0a10;
  --panel: #15131d;
  --line: #2a2636;
  --text: #f1eef8;
  --muted: #8d87a0;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #facc15;
  --blue: #3b82f6;
  --orange: #f97316;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 'Space Grotesk', system-ui, sans-serif;
  min-height: 100vh;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font: 64px/0.9 'Bebas Neue', sans-serif; letter-spacing: 1px; margin: 0; }
h1 span { color: var(--yellow); }
.frets { display: flex; gap: 6px; margin-top: 10px; }
.frets i { width: 28px; height: 6px; border-radius: 3px; display: block; }
.key { display: flex; gap: 8px; align-items: center; }
.key input {
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  padding: 8px 10px; border-radius: 8px; font: inherit; width: 200px;
}
.drop {
  margin-top: 28px; border: 2px dashed var(--line); border-radius: 16px;
  padding: 48px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  background: var(--panel);
}
.drop.over { border-color: var(--yellow); background: #1c1926; }
.drop strong { font: 32px 'Bebas Neue', sans-serif; letter-spacing: 1px; display: block; }
.drop p { color: var(--muted); margin: 4px 0 0; }
.status { margin-top: 16px; min-height: 24px; color: var(--muted); }
.status.err { color: var(--red); }
.result {
  display: none; margin-top: 8px; gap: 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.result.show { display: flex; }
.result img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
.result input { flex: 1; min-width: 0; }
input.link {
  background: var(--bg); border: 1px solid var(--line); color: var(--text);
  padding: 8px 10px; border-radius: 8px; font: 13px ui-monospace, monospace;
}
button {
  background: var(--green); color: #04130a; border: 0; border-radius: 8px;
  padding: 8px 14px; font: 600 14px 'Space Grotesk', sans-serif; cursor: pointer;
}
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
button.danger { background: transparent; color: var(--red); border: 1px solid var(--line); }
h2 { font: 28px 'Bebas Neue', sans-serif; letter-spacing: 1px; margin: 48px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card a { display: block; aspect-ratio: 16 / 10; background: #000; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .row { display: flex; gap: 6px; padding: 8px; }
.card .row button { flex: 1; padding: 6px; font-size: 13px; }
.empty { color: var(--muted); }
.zig { margin-top: 48px; color: var(--muted); font-size: 13px; }
.zig b { color: var(--orange); }
@media (max-width: 560px) {
  h1 { font-size: 48px; }
  .key, .key input { width: 100%; }
  .result { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Score <span>Shots</span></h1>
      <div class="frets">
        <i style="background:var(--green)"></i><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--blue)"></i><i style="background:var(--orange)"></i>
      </div>
    </div>
    <label class="key">
      <input id="key" type="password" placeholder="Upload key" autocomplete="off">
    </label>
  </header>

  <div class="drop" id="drop">
    <strong>Drop score screenshot</strong>
    <p>Click, drag, or paste (Ctrl+V). PNG, JPEG, GIF, WebP.</p>
    <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
  </div>

  <div class="status" id="status"></div>
  <div class="result" id="result">
    <img id="resultImg" alt="">
    <input class="link" id="resultLink" readonly>
    <button id="copyResult">Copy</button>
  </div>

  <h2>Uploaded</h2>
  <div class="grid" id="grid"></div>

  <p class="zig">Images validated by a <b>Zig</b> WebAssembly module before storage.</p>
</div>

<script>
const MAX_BYTES = 4 * 1024 * 1024;
const $ = (id) => document.getElementById(id);
const keyInput = $('key');

try { keyInput.value = localStorage.getItem('uploadKey') || ''; } catch {}
keyInput.addEventListener('input', () => {
  try { localStorage.setItem('uploadKey', keyInput.value); } catch {}
});

function setStatus(text, err = false) {
  $('status').textContent = text;
  $('status').className = 'status' + (err ? ' err' : '');
}

async function shrink(file) {
  if (file.size <= MAX_BYTES) return file;
  const bitmap = await createImageBitmap(file);
  let scale = Math.min(1, 2560 / Math.max(bitmap.width, bitmap.height));
  for (let quality = 0.92; ; quality -= 0.08) {
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
    if (blob.size <= MAX_BYTES) return blob;
    if (quality < 0.6) scale *= 0.8;
  }
}

async function upload(file) {
  if (!keyInput.value) return setStatus('Enter upload key first.', true);
  setStatus(`Uploading ${file.name || 'image'}...`);
  const body = await shrink(file);
  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'x-upload-key': keyInput.value, 'Content-Type': 'application/octet-stream' },
    body,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return setStatus(data.error || `Upload failed (${res.status})`, true);
  setStatus(`Done. ${data.width}x${data.height}`);
  $('resultImg').src = data.url;
  $('resultLink').value = data.url;
  $('result').classList.add('show');
  copy(data.url);
  loadGrid();
}

async function uploadAll(files) {
  for (const f of files) if (f.type.startsWith('image/')) await upload(f);
}

function copy(text) {
  navigator.clipboard?.writeText(text).then(() => setStatus($('status').textContent + ' Link copied.'), () => {});
}

async function remove(name) {
  if (!confirm(`Delete ${name}?`)) return;
  const res = await fetch(`/api/images?name=${encodeURIComponent(name)}`, {
    method: 'DELETE',
    headers: { 'x-upload-key': keyInput.value },
  });
  if (!res.ok) return setStatus('Delete failed. Check upload key.', true);
  loadGrid();
}

async function loadGrid() {
  const grid = $('grid');
  const res = await fetch('/api/images');
  const items = res.ok ? await res.json() : [];
  grid.replaceChildren();
  if (!items.length) {
    grid.innerHTML = '<p class="empty">No scores yet.</p>';
    return;
  }
  for (const item of items) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<a target="_blank" rel="noopener"><img loading="lazy" alt=""></a>
      <div class="row"><button class="ghost" data-act="copy">Copy link</button><button class="danger" data-act="del">Delete</button></div>`;
    card.querySelector('a').href = item.url;
    card.querySelector('img').src = item.url;
    card.querySelector('[data-act=copy]').onclick = () => {
      navigator.clipboard?.writeText(item.url);
      setStatus(`Copied ${item.url}`);
    };
    card.querySelector('[data-act=del]').onclick = () => remove(item.name);
    grid.append(card);
  }
}

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = (e) => uploadAll(e.target.files);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); uploadAll(e.dataTransfer.files); };
document.addEventListener('paste', (e) => uploadAll([...e.clipboardData.files]));
$('copyResult').onclick = () => copy($('resultLink').value);

loadGrid();
</script>
</body>
</html>
